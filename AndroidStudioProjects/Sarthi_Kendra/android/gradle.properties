# 4 GB is plenty for this app; 8 GB can make Windows swap to disk.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Safety net: if any plugin still has a Java/Kotlin JVM-target mismatch,
# report it as a warning instead of failing the build.
kotlin.jvm.target.validation.mode=warning